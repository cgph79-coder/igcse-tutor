# Cloudflare Worker for IGCSE Tutor.
# Secrets (API key, passcodes) are NOT in this file. Set them with `npx wrangler secret put <NAME>`.
name = "igcse-tutor-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true      # serve at igcse-tutor-worker.<subdomain>.workers.dev
preview_urls = false    # no extra preview URLs for each version

# KV namespace for usage caps, login throttling and parent-review session logs.
# Create it with `npx wrangler kv namespace create TUTOR_KV` and paste the id below.
[[kv_namespaces]]
binding = "TUTOR_KV"
id = "952b3aed5018401d9e9906d7d313dfcb"

[vars]
# --- LLM provider (any OpenAI-compatible chat completions API) ---
# DeepSeek direct (data stored in China):
LLM_BASE_URL = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"
# OpenRouter (US hosts) instead — swap the two lines above for:
# LLM_BASE_URL = "https://openrouter.ai/api/v1"
# LLM_MODEL = "deepseek/deepseek-chat"

# --- Photo checking (model that can read images; used only when a message has photos) ---
# Its key is the LLM_VISION_API_KEY secret. Until that's set, photos are politely refused.
# Cheaper alternative with the same setup: "anthropic/claude-haiku-5.5".
LLM_VISION_BASE_URL = "https://openrouter.ai/api/v1"
LLM_VISION_MODEL = "anthropic/claude-sonnet-5.5"

# Only this site may call the Worker (comma-separated list allowed).
ALLOWED_ORIGINS = "https://cgph79-coder.github.io"

# --- Cost controls ---
MAX_TOKENS = "800"              # max length of one tutor reply (+400 in Mark my answer)
MAX_TOKENS_PHOTOS = "2000"      # max length of a reply marking photos/PDF pages
MAX_TOKENS_QUIZ = "3000"        # max length of one batch of arcade-game questions
MAX_TOKENS_QUIZ_CHECK = "1500"  # max length of the check that removes wrong or ambiguous cards
MAX_HISTORY_MESSAGES = "16"     # older messages are dropped
MAX_HISTORY_CHARS = "24000"     # and the history is capped at this many characters
DAILY_REQUEST_LIMIT = "150"     # messages per student per day (UK time)
DAILY_TOKEN_LIMIT = "400000"    # tokens per student per day
LOG_RETENTION_DAYS = "90"
EXAM_DAILY_LIMIT = "4"          # Editor's desk runs per day (exam-style questions marked by the tutor; 2 model calls each)
MAX_TOKENS_EXAM = "2500"        # writing the 3 questions and their mark schemes
MAX_TOKENS_EXAM_MARK = "1500"   # marking the 3 answers
